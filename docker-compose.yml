# Local development: `docker compose up --build`, then open http://localhost:8080
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: eliava
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:devpass@db:5432/eliava?sslmode=disable
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      PAYMENTS_MODE: mock
      AI_API_KEY: ${AI_API_KEY:-}
    ports: ["8080:8080"]
    volumes: [uploads:/app/uploads]
volumes:
  dbdata:
  uploads:
